apiVersion: apps/v1
kind: Deployment
metadata:
    name: my-portfolio
spec:
    selector:
        matchLabels:
            app: my-protifolio
    replicas: 1
    template:
        metadata:
            labels:
                app: my-protifolio
        spec:
            containers:
                - name: javagradle
                  imagePullPolicy: Never
                  image: kolan7416/java-gradle:latest
                  resources:
                      limits:
                          cpu: 50m
                          memory: 100Mi
                      requests:
                          cpu: 25m
                          memory: 10Mi
                  ports:
                      - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
    name: my-portfolio-service
spec:
    type: NodePort
    selector:
        app: my-portfolio
    ports:
        - port: 8080
          targetPort: 8080
